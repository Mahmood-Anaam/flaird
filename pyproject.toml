[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "flaird"
version = "1.0.0"
description = "Forensic Linguistics and AI for the Detection of Machine-Generated Disinformation Campaigns"
authors = [
  { name = "Mahmood Anaam" }
]
license = { text = "Apache License 2.0" }
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "click>=8.4.2,<9",
    "pystylometry[all]>=1.4.3,<2",
    "scikit-learn>=1.6,<2",
    "transformers==5.16.1",
]

[project.optional-dependencies]
train = [
    "accelerate>=1.10.1,<2",
    "datasets>=4,<5",
    "tensorboard>=2.18,<3",
    "wandb>=0.21,<1",
]
demo = [
    "gradio>=5.50,<7",
]
dev = [
    "pytest>=8,<10",
    "ruff==0.14.10",
]

[project.urls]
repository = "https://github.com/Mahmood-Anaam/flaird"

[project.scripts]
flaird-train = "flaird.scripts.train:main"
flaird-evaluator = "flaird.scripts.evaluator:main"
flaird-inference = "flaird.scripts.inference:main"
flaird-tira-submission = "flaird.scripts.tira_submission:main"



[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["flaird*"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
