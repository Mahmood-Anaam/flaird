name: Upload Software to TIRA
on:
  workflow_dispatch:
    inputs:
      directory:
        description: 'The directory that contains the submission. Can be . for the root of the repository'
        required: true
        default: '.'
      model:
        description: 'The HuggingFace model repository to evaluate (e.g., yusr9/flaird-modernbert-large-attention-multitask)'
        required: false
        default: 'yusr9/flaird-modernbert-large-attention-multitask'

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Set up Dependencies
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install required python packages
        run: |
          python -m pip install --upgrade pip
          pip3 install tira

      - name: Build, test, and upload image
        env:
          MODEL: ${{ inputs.model }}
        run: |
          tira-cli login --token ${{ secrets.TIRA_CLIENT_TOKEN }}
          tira-cli verify-installation
          tira-cli code-submission \
            --path ${{ inputs.directory }} \
            --task generative-ai-authorship-verification-panclef-2026 \
            --dataset generative-ai-authorship-verification-panclef-2026/pan26-generative-ai-detection-smoke-test-20260330-training
