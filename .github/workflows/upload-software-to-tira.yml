name: Upload Software to TIRA
on:
  workflow_dispatch:
    inputs:
      directory:
        description: "Directory containing the submission; use . for the repository root"
        required: true
        default: .
        type: string
      model_id:
        description: "Hugging Face model repository (full ID or repository name)"
        required: true
        default: yusr9/flaird-modernbert-large-attention-multitask-frozen
        type: string
      dry_run:
        description: "Build and test without uploading to TIRA"
        required: true
        type: boolean
        default: true
jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Set up Dependencies
        uses: actions/setup-python@v4
        with:
          python-version: 3.12
      - name: Install TIRA CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install "tira==${TIRA_CLI_VERSION}"

      - name: Authenticate with TIRA
        run: tira-cli login --token "${{ secrets.TIRA_CLIENT_TOKEN }}"

      - name: Verify local installation
        run: tira-cli verify-installation --local-only
      

      - name: Download Hugging Face model
        run: |
          python -m pip install --upgrade "huggingface_hub>=0.34,<2"

          python - <<'PY'
          from huggingface_hub import snapshot_download

          path = snapshot_download(
              repo_id="yusr9/flaird-modernbert-large-attention-multitask-frozen",
              ignore_patterns=["*.bin", "onnx/*"],
          )
          print(f"Model cached at: {path}")
          PY
          test -d "${HOME}/.cache/huggingface/hub/models--yusr9--flaird-modernbert-large-attention-multitask-frozen"

      - name: Build, test, and upload image
        run: |
          echo "Verificacion completada. Iniciando la subida del container a TIRA (PANCLEF 2026)..."
          tira-cli code-submission \
              --dry-run \
              --path "${{ inputs.directory }}" \
              --task generative-ai-authorship-verification-panclef-2026 \
              --dataset pan26-generative-ai-detection-smoke-test-20260330-training \
              --platform linux/amd64 \
              --mount-hf-model "${{ inputs.model_id}}" \
              --command "/usr/local/bin/flaird --model yusr9/flaird-modernbert-large-attention-multitask-frozen"
          