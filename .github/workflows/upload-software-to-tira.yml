name: Upload Software to TIRA

on:
  workflow_dispatch:
    inputs:
      directory:
        description: 'The directory that contains the submission. Can be . for the root of the repository'
        required: true
        default: .
        type: string
      dry_run:
        description: 'Build and test without uploading to TIRA'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  DOCKER_HOST: unix:///var/run/docker.sock
  TIRA_CLI_VERSION: '0.0.204'
  TIRA_TASK: generative-ai-authorship-verification-panclef-2026
  TIRA_DATASET: pan26-generative-ai-detection-smoke-test-20260330-training

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install TIRA CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install "tira==${TIRA_CLI_VERSION}"

      - name: Authenticate with TIRA
        run: tira-cli login --token "${{ secrets.TIRA_CLIENT_TOKEN }}"

      - name: Verify local installation
        run: tira-cli verify-installation --local-only

      - name: Download Hugging Face model
        run: |
          python -m pip install --upgrade "huggingface_hub>=0.34,<2"

          python - <<'PY'
          import shutil
          from pathlib import Path

          from huggingface_hub import snapshot_download

          repo_id = "yusr9/flaird-modernbert-large-attention-multitask-frozen"
          snapshot = Path(snapshot_download(repo_id=repo_id, ignore_patterns=["onnx/*"]))

          # TIRA bind-mounts the model cache directory into the container.
          # Materialize the snapshot so its files do not depend on symlinks to
          # blobs outside the mounted directory.
          materialized = snapshot.with_name(snapshot.name + ".materialized")
          if materialized.exists():
              shutil.rmtree(materialized)
          shutil.copytree(snapshot, materialized, symlinks=False)
          shutil.rmtree(snapshot)
          materialized.rename(snapshot)

          weights = list(snapshot.glob("*.safetensors")) + list(snapshot.glob("*.bin"))
          if not weights or not any(weight.is_file() and weight.stat().st_size > 0 for weight in weights):
              raise RuntimeError(f"No non-empty model weights found in {snapshot}")
          print(f"Materialized model snapshot: {snapshot}")
          for weight in weights:
              print(f"Model weights: {weight} ({weight.stat().st_size} bytes)")
          PY

          model_cache="${HOME}/.cache/huggingface/hub/models--yusr9--flaird-modernbert-large-attention-multitask-frozen"
          test -d "${model_cache}"
          test -n "$(find "${model_cache}/snapshots" -type f \( -name '*.safetensors' -o -name '*.bin' \) -size +0c -print -quit)"

      - name: Build, test, and upload image
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          submission_args=(
            --path "${{ inputs.directory }}"
            --task "${TIRA_TASK}"
            --dataset "${TIRA_DATASET}"
            --platform linux/amd64
            --mount-hf-model
            yusr9/flaird-modernbert-large-attention-multitask-frozen
            --command "/usr/local/bin/flaird --model yusr9/flaird-modernbert-large-attention-multitask-frozen"
          )

          if [[ "${DRY_RUN}" == "true" ]]; then
            submission_args+=(--dry-run)
          fi

          tira-cli code-submission "${submission_args[@]}"
